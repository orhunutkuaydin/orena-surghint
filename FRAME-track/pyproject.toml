[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "surghint"
version = "0.1.0"
description = "Team VLM_MAXXING's ORena FRAME track solution"
readme = "README.md"
requires-python = ">=3.11,<3.12"
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = [
    "torch==2.11.0+cu128",
    "torchvision==0.26.0+cu128",
    "transformers==5.14.1",
    "accelerate==1.14.0",
    "peft==0.20.0",
    "huggingface_hub==1.28.0",
    "safetensors==0.8.0",
    "torchmetrics==1.9.0",
    "ftfy==6.3.1",
    "regex==2026.7.19",
    "omegaconf==2.3.1",
    "termcolor==3.3.0",
    "protobuf==7.36.0",
    "numpy==2.4.3",
    "pillow==12.1.1",
    "pandas==3.0.5",
    "pyarrow==25.0.1",
    "decord==0.6.0",
    "scipy==1.17.0",
    "scikit-learn==1.8.0",
    "submitit==1.5.4",
    "pycocotools==2.0.10",
    "timm==1.0.27",
]

[project.scripts]
surghint = "surghint.inference:main"

[tool.setuptools]
packages = ["surghint", "training", "preprocessing"]
include-package-data = false

[tool.setuptools.package-data]
surghint = ["checksums.txt"]
