[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "surghint-segment"
version = "0.1.0"
description = "SurgHint surgical video question answering"
readme = "README.md"
requires-python = ">=3.11,<3.12"
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = [
    "torch==2.11.0+cu128",
    "torchvision==0.26.0+cu128",
    "transformers==5.14.1",
    "accelerate==1.14.0",
    "peft==0.20.0",
    "decord==0.6.0",
    "rfdetr==1.9.1",
    "trackers==2.5.0.post0",
    "supervision==0.30.1",
    "av==18.0.0",
    "pydeprecate==0.9.0",
    "defusedxml==0.7.1",
    "numpy==2.4.6",
    "opencv-python==5.0.0.93",
    "pillow==12.3.0",
    "scipy==1.17.1",
    "safetensors==0.8.0",
    "huggingface-hub==1.27.0",
]

[project.optional-dependencies]
training = ["pyarrow==25.0.1", "packaging", "psutil", "ninja"]

[project.scripts]
surghint = "surghint.inference:main"

[tool.setuptools]
packages = ["surghint", "training", "preprocessing"]
include-package-data = false

[tool.setuptools.package-data]
surghint = ["checksums.txt"]
